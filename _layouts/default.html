<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: "en" }}">
    <head>
        <meta charset="UTF-8">
        <title>{{ page.title }}</title>
        <meta name="viewport" content="width=device-width, initial-scale=1">

        <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
        <link rel="stylesheet" href="{{ '/assets/css/tocbot.css' | relative_url }}">
        <link rel="stylesheet" href="{{ '/assets/css/rouge.css' | relative_url }}">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

        {% seo %}
    </head>
    <body>
        {% assign lang = page.lang | default: site.lang | default: "en" %}
        
        <nav class="navbar">
            <button id="toggle-sidebar" class="expanded">☰</button>
            <div class="nav-links">
                <a id="home-link" href="{{ '/' | append: lang | append: '/' | relative_url }}"><i class="fas fa-home"></i> Home</a>
                <a id="tools-link" href="{{ '/' | append: lang | append: '/tools/' | relative_url }}"><i class="fas fa-tools"></i> Tools</a>
                <a id="notes-link" href="{{ '/' | append: lang | append: '/notes/' | relative_url }}"><i class="fas fa-sticky-note"></i> Notes</a>
                <a id="blog-link" href="{{ '/' | append: lang | append: '/blog/' | relative_url }}"><i class="fas fa-pen-nib"></i> Blog</a>
                <a id="about-link" href="{{ '/' | append: lang | append: '/about/' | relative_url }}"><i class="fas fa-info-circle"></i> About</a>
            </div>
            <div class="navbar-controls">
                <select id="language-select" title="Select Language">
                    <option value="en">EN</option>
                    <option value="zh">繁中</option>
                    <option value="nl">NL</option>
                    <option value="de">DE</option>
                </select>
            </div>
        </nav>
        <div class="container">
            <div class="sidebar-wrapper">
                <nav class="sidebar js-toc"></nav>
            </div>
            <main class="content js-toc-content">{{ content }}</main>
        </div>
        <script src="{{ '/assets/js/main.js' | relative_url }}"></script>
        <script src="https://cdn.jsdelivr.net/npm/tocbot@4.20.1/dist/tocbot.min.js"></script>
    </body>
</html>
