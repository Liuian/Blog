    <p><strong>Create a <code class="language-plaintext highlighter-rouge">.gitignore</code> file</strong></p>

    <div class="language-bash highlighter-rouge"><div class="highlight"><pre class="highlight"><code><span class="nb">touch</span> .gitignore

  <li>

    <div class="language-bash highlighter-rouge"><div class="highlight"><pre class="highlight"><code><span class="nb">echo</span> <span class="s2">".python-version"</span> <span class="o">&gt;&gt;</span> .gitignore
</code></pre></div>    </div>
  </li>
  <li>
    <p><strong>Check the contents</strong></p>

    <div class="language-bash highlighter-rouge"><div class="highlight"><pre class="highlight"><code><span class="nb">cat</span> .gitignore
</code></pre></div>    </div>
  </li>
</ul>
